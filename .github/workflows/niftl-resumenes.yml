name: Redactar resúmenes NFL de Niftl

on:
  workflow_dispatch:
  schedule:
    - cron: '1-59/10 * * * *'

permissions: {}
concurrency:
  group: niftl-news-summaries
  cancel-in-progress: false

jobs:
  redactar:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
      id-token: write
    env:
      NIFTL_URL: https://campo-nfl-tribuna.lissomegardenia2.chatgpt.site
      LLAMA_VERSION: b12732
      LLAMA_SHA256: bf402879b3c22200f758adc64de3a457c2cb57d179ba1bfe2d66143fb23cb897
      # Derivado Apache-2.0 de Qwen/Qwen3-4B-Instruct-2507, cuantizado por Unsloth.
      GGUF_REVISION: 75818336d16b082f8427aeac9d13afb6e7b983d9
      GGUF_SHA256: 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Consultar cola de resúmenes
        id: cola
        timeout-minutes: 1
        shell: bash
        run: |
          python3 -B -m unittest discover -s scripts
          count=$(python3 scripts/redactar_noticias.py --pending-only --limit 2 --queue-file "$RUNNER_TEMP/niftl-queue.json")
          [[ "$count" =~ ^[0-9]+$ ]]
          printf 'count=%s\n' "$count" >> "$GITHUB_OUTPUT"
          printf 'Noticias pendientes: %s\n' "$count"

      - name: Restaurar los pesos
        if: steps.cola.outputs.count != '0'
        id: pesos
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/niftl-model/qwen.gguf
          key: niftl-news-gguf-${{ env.GGUF_SHA256 }}

      - name: Verificar y descargar los pesos
        if: steps.cola.outputs.count != '0'
        timeout-minutes: 5
        shell: bash
        run: |
          model="$RUNNER_TEMP/niftl-model/qwen.gguf"
          mkdir -p "$(dirname "$model")"
          if [[ -f "$model" ]] && printf '%s  %s\n' "$GGUF_SHA256" "$model" | sha256sum --check --status; then
            echo 'Pesos verificados desde la caché.'
            exit 0
          fi
          url="https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/$GGUF_REVISION/Qwen3-4B-Instruct-2507-Q4_K_M.gguf?download=true"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-max-time 260 --connect-timeout 15 --max-time 260 --output "$model.part" "$url"
          printf '%s  %s\n' "$GGUF_SHA256" "$model.part" | sha256sum --check
          mv "$model.part" "$model"

      - name: Guardar los pesos verificados
        if: steps.cola.outputs.count != '0' && steps.pesos.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/niftl-model/qwen.gguf
          key: niftl-news-gguf-${{ env.GGUF_SHA256 }}

      - name: Instalar llama.cpp para CPU
        if: steps.cola.outputs.count != '0'
        timeout-minutes: 1
        shell: bash
        run: |
          archive="$RUNNER_TEMP/niftl-model/llama.tar.gz"
          url="https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_VERSION/llama-$LLAMA_VERSION-bin-ubuntu-x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 1 --retry-max-time 45 --connect-timeout 10 --max-time 40 --output "$archive" "$url"
          printf '%s  %s\n' "$LLAMA_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/niftl-model"
          "$RUNNER_TEMP/niftl-model/llama-$LLAMA_VERSION/llama-server" --version

      - name: Traducir, verificar y publicar los resúmenes
        if: steps.cola.outputs.count != '0'
        timeout-minutes: 15
        shell: bash
        run: |
          local_port=18452
          local_url="http://127.0.0.1:$local_port"
          model_dir="$RUNNER_TEMP/niftl-model"
          server_log="$RUNNER_TEMP/niftl-llama-server.log"
          env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            "$model_dir/llama-$LLAMA_VERSION/llama-server" --model "$model_dir/qwen.gguf" --alias niftl \
            --host 127.0.0.1 --port "$local_port" --no-ui --n-gpu-layers 0 --threads 4 --threads-batch 4 \
            --ctx-size 4096 --batch-size 256 --parallel 1 --reasoning off > "$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent --max-time 2 "$local_url/health" >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null || [[ "$attempt" == 40 ]]; then
              echo '::error::El modelo local no respondió durante el arranque.'
              tail -n 15 "$server_log"
              exit 1
            fi
            sleep 1
          done
          python3 scripts/redactar_noticias.py --queue-file "$RUNNER_TEMP/niftl-queue.json" --limit 2 \
            --model-url "$local_url/v1/chat/completions" --model-timeout 195 --budget-seconds 800
