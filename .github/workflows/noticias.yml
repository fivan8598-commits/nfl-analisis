name: Actualizar noticias de Niftl

on:
  workflow_dispatch:
  schedule:
    - cron: '4-59/5 * * * *'

permissions: {}
concurrency:
  group: niftl-public-news-refresh
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Consultar y verificar el corte público
        run: node refresh-news.mjs
